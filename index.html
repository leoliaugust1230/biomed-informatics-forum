  .add-btn { width:auto; height:auto; padding:7px 14px; text-transform:uppercase; }
  .add-btn:hover { background:var(--edit); color:#fff; }

  .li-row { display:flex; align-items:flex-start; gap:8px; }

  #toast {
    position:fixed; z-index:300; left:0; right:0; margin:0 auto; width:fit-content; bottom:86px;
    background:var(--ink); color:var(--bg); font-family:var(--font-mono); font-size:12px;

  }
  #toast.show { opacity:1; }

  @media (max-width:640px) {
    #bar .pill { display:none; }
    #bar button { padding:8px 12px; }
  }
  @media print { #bar, #toast, .tools, .add-row, #settings { display:none !important; } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>

<script id="app">
(function () {
  "use strict";

  var STATE = JSON.parse(document.getElementById("state").textContent);
  var EDITING = false;
  var DIRTY = false;
  var CAN_WRITE = false;
  var artifactNS = null;

  /* ---------------- helpers ---------------- */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;")
      .replace(/[\u0080-\uffff]/g, function (c) { return "&#" + c.charCodeAt(0) + ";"; });
  }
  function get(path) {
    return path.split(".").reduce(function (o, k) {
      return o == null ? undefined : o[/^\d+$/.test(k) ? Number(k) : k];
    }, STATE);
  }
  function set(path, val) {
    var keys = path.split(".");
    var last = keys.pop();
    var obj = keys.reduce(function (o, k) { return o[/^\d+$/.test(k) ? Number(k) : k]; }, STATE);
    obj[/^\d+$/.test(last) ? Number(last) : last] = val;
  }
  /* b(path) marks an element editable and bound to a state path. */
  function b(path) { return ' data-bind="' + esc(path) + '"'; }
  function tools(arrPath, i, opts) {
    opts = opts || {};
    var h = '<div class="tools" data-arr="' + esc(arrPath) + '" data-i="' + i + '">';
    if (!opts.noMove) {
      h += '<button type="button" data-act="up" title="Move up" aria-label="Move up">&#9650;</button>';
      h += '<button type="button" data-act="down" title="Move down" aria-label="Move down">&#9660;</button>';
    }
    if (opts.star) h += '<button type="button" data-act="star" title="Toggle highlight" aria-label="Toggle highlight">&#9733;</button>';
    h += '<button type="button" data-act="del" title="Delete" aria-label="Delete">&times;</button>';
    return h + "</div>";
  }
  function addRow(arrPath, label) {
    return '<div class="add-row"><button type="button" class="add-btn" data-add="' + esc(arrPath) + '">+ ' + esc(label) + "</button></div>";
  }

  /* ---------------- render ---------------- */
  function render() {
    var s = STATE, h = "";
    var reg = esc(s.meta.regUrl);

    /* header */
    h += '<header class="top"><div class="wrap top-in">';
    h += '<a class="mark" href="#top"><span' + b("meta.wordmark") + ">" + esc(s.meta.wordmark) + '</span> <span' + b("meta.wordmarkYear") + ">" + esc(s.meta.wordmarkYear) + "</span></a>";
    h += '<nav class="top-nav">';
    s.nav.forEach(function (n, i) {
      h += '<a href="' + esc(n.href) + '"' + b("nav." + i + ".label") + ">" + esc(n.label) + "</a>";
    });
    h += "</nav>";
    h += '<a class="btn btn-sm" href="' + reg + '">Register</a>';
    h += "</div></header>";

    /* hero */
    h += '<main id="top"><section class="hero"><canvas id="trace" aria-hidden="true"></canvas><div class="wrap hero-in">';
    h += '<p class="eyebrow"' + b("hero.eyebrow") + ">" + esc(s.hero.eyebrow) + "</p>";
    h += "<h1><span" + b("hero.title") + ">" + esc(s.hero.title) + "</span> <em" + b("hero.titleAccent") + ">" + esc(s.hero.titleAccent) + "</em></h1>";
    h += '<p class="hero-dek"' + b("hero.dek") + ">" + esc(s.hero.dek) + "</p>";
    h += '<div class="hero-cta">';
    h += '<a class="btn" href="' + reg + '"><span' + b("hero.ctaPrimary") + ">" + esc(s.hero.ctaPrimary) + "</span></a>";
    h += '<a class="btn btn-ghost" href="#agenda"><span' + b("hero.ctaSecondary") + ">" + esc(s.hero.ctaSecondary) + "</span></a>";
    h += '<span class="cta-note"' + b("hero.ctaNote") + ">" + esc(s.hero.ctaNote) + "</span>";
    h += "</div></div>";

    /* facts */

    s.facts.forEach(function (f, i) {
      h += '<div class="fact">';
      h += '<p class="fact-l"' + b("facts." + i + ".label") + ">" + esc(f.label) + "</p>";

      h += '<div class="slot-body">';

    /* register */
    h += '<section class="sec" id="register"><div class="wrap">';

      h += '<p class="tier-who"' + b(p + ".who") + ">" + esc(t.who) + "</p>";

        h += '<li><span class="li-row"><span' + b(p + ".items." + j) + ">" + esc(it) + "</span>" + tools(p + ".items", j, { noMove: true }) + "</span></li>";
      });
      h += "</ul>";
      h += '<div class="add-row"><button type="button" class="add-btn" data-add="' + p + '.items">+ Add line</button></div>';
      h += '<a class="btn" href="' + reg + '"><span' + b(p + ".cta") + ">" + esc(t.cta) + "</span></a>";
      h += "</div>";
    });
    h += "</div>" + addRow("register.tiers", "Add ticket tier");
    h += '<p class="fineprint"' + b("register.fineprint") + ">" + esc(s.register.fineprint) + "</p>";
    h += "</div></section>";

    /* sponsor */
    h += '<section class="sec sec-alt" id="sponsor"><div class="wrap">';
    h += '<div class="sec-head"><p class="eyebrow"' + b("sponsor.eyebrow") + ">" + esc(s.sponsor.eyebrow) + "</p><h2" + b("sponsor.heading") + ">" + esc(s.sponsor.heading) + "</h2></div>";
    s.sponsor.list.forEach(function (sp, i) {
      var p = "sponsor.list." + i;
      h += '<div class="sponsor">' + tools("sponsor.list", i);
      h += "<div>";
      h += '<span class="sponsor-badge"' + b(p + ".badge") + ">" + esc(sp.badge) + "</span>";
      h += '<p class="sponsor-name"><a href="' + esc(sp.url) + '" target="_blank" rel="noopener"' + b(p + ".name") + ">" + esc(sp.name) + "</a></p>";
      h += '<div class="sponsor-stats">';
      sp.stats.forEach(function (st, j) {
        h += '<div class="stat"><b' + b(p + ".stats." + j + ".v") + ">" + esc(st.v) + "</b><span" + b(p + ".stats." + j + ".l") + ">" + esc(st.l) + "</span></div>";
      });
      h += "</div></div>";
      h += "<div>";
      h += '<p class="sponsor-quote"' + b(p + ".quote") + ">" + esc(sp.quote) + "</p>";
      h += '<p class="fineprint" style="margin-top:16px"><span' + b(p + ".blurb") + ">" + esc(sp.blurb) + '</span> <a href="' + esc(sp.url) + '" target="_blank" rel="noopener"' + b(p + ".linkText") + ">" + esc(sp.linkText) + "</a></p>";
      h += "</div></div>";
    });
    h += addRow("sponsor.list", "Add sponsor");

    h += '<div class="sec-head" style="margin-top:64px; margin-bottom:0">';
    h += '<p class="eyebrow"' + b("sponsor.tiersEyebrow") + ">" + esc(s.sponsor.tiersEyebrow) + "</p>";
    h += '<h2 style="font-size:26px"' + b("sponsor.tiersHeading") + ">" + esc(s.sponsor.tiersHeading) + "</h2>";
    h += "<p><span" + b("sponsor.tiersIntro") + ">" + esc(s.sponsor.tiersIntro) + '</span> <a href="mailto:' + esc(s.meta.email) + '">' + esc(s.meta.email) + "</a>.</p></div>";
    h += '<div class="table-scroll"><table><thead><tr><th>Tier</th><th>Fee</th><th>Included benefits</th><th>Registrations</th><th></th></tr></thead><tbody>';
    s.sponsor.rows.forEach(function (r, i) {
      var p = "sponsor.rows." + i;
      h += "<tr" + (r.taken ? ' class="is-taken"' : "") + ">";
      h += "<td><span" + b(p + ".tier") + ">" + esc(r.tier) + "</span>" + (r.taken ? '<span class="taken-pill">Taken</span>' : "") + "</td>";
      h += '<td class="num"' + b(p + ".fee") + ">" + esc(r.fee) + "</td>";
      h += "<td" + b(p + ".benefits") + ">" + esc(r.benefits) + "</td>";

      h += "</tr>";

    h += "</div></section>";

    /* committee */
    h += '<section class="sec" id="committee"><div class="wrap">';
    h += '<div class="sec-head"><p class="eyebrow"' + b("committee.eyebrow") + ">" + esc(s.committee.eyebrow) + "</p><h2" + b("committee.heading") + ">" + esc(s.committee.heading) + "</h2></div>";

    /* settings panel (edit mode only) */
    h = settingsHTML() + h;

  function head(sec, key) {
    return '<div class="sec-head"><p class="eyebrow"' + b(key + ".eyebrow") + ">" + esc(sec.eyebrow) + "</p>" +

  function settingsHTML() {
    return '<div class="wrap" style="padding-top:20px"><div id="settings">' +
      '<div class="f"><label for="f-reg">Registration link</label><input id="f-reg" type="url" data-field="meta.regUrl" value="' + esc(STATE.meta.regUrl) + '"></div>' +
      '<div class="f"><label for="f-mail">Contact email</label><input id="f-mail" type="email" data-field="meta.email" value="' + esc(STATE.meta.email) + '"></div>' +
      '<div class="f"><label for="f-title">Browser tab title</label><input id="f-title" type="text" data-field="meta.title" value="' + esc(STATE.meta.title) + '"></div>' +
      "</div></div>";
  }

  /* ---------------- paint ---------------- */
  function paint() {
    document.getElementById("root").innerHTML = render();
    initTrace();
    if (EDITING) applyEditable(true);
  }

  function applyEditable(on) {
    document.body.classList.toggle("editing", on);
    var nodes = document.querySelectorAll("#root [data-bind]");
    for (var i = 0; i < nodes.length; i++) {
      if (on) {
        nodes[i].setAttribute("contenteditable", "true");
        nodes[i].setAttribute("spellcheck", "true");
      } else {
        nodes[i].removeAttribute("contenteditable");
      }
    }
    var t = document.getElementById("b-toggle");
    var sv = document.getElementById("b-save");
    var cx = document.getElementById("b-cancel");
    t.textContent = on ? "Preview" : "Edit page";
    sv.hidden = !on;
    cx.hidden = !on;
    status(on ? "Click any text to edit" : (DIRTY ? "Unsaved changes" : "Editable"));
  }

  function status(msg) { document.getElementById("bar-status").textContent = msg; }

  var toastTimer;
  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 3200);
  }

  /* ---------------- editing events ---------------- */
  document.addEventListener("input", function (e) {
    var el = e.target;
    if (el.hasAttribute && el.hasAttribute("data-bind")) {
      set(el.getAttribute("data-bind"), el.textContent);
      markDirty();
    } else if (el.hasAttribute && el.hasAttribute("data-field")) {
      set(el.getAttribute("data-field"), el.value);
      markDirty();
    }
  });

  /* keep pasted content plain */
  document.addEventListener("paste", function (e) {
    var el = e.target;
    if (!el.hasAttribute || !el.hasAttribute("data-bind")) return;
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData("text/plain");
    document.execCommand("insertText", false, text.replace(/\s*\n\s*/g, " "));
  });

  /* Enter should not create markup inside a bound field */
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.hasAttribute && e.target.hasAttribute("data-bind")) {
      e.preventDefault();
      e.target.blur();
    }
  });

  function markDirty() {
    if (!DIRTY) { DIRTY = true; }
    status("Unsaved changes");
  }

  function blank(sample) {
    if (sample === null || sample === undefined) return "";
    if (typeof sample === "string") return "";
    if (typeof sample === "boolean") return false;
    if (Array.isArray(sample)) return sample.length ? [blank(sample[0])] : [];
    var o = {};
    Object.keys(sample).forEach(function (k) { o[k] = blank(sample[k]); });
    return o;
  }

  document.addEventListener("click", function (e) {
    var addBtn = e.target.closest ? e.target.closest("[data-add]") : null;
    if (addBtn) {
      e.preventDefault();
      var arr = get(addBtn.getAttribute("data-add"));
      if (!Array.isArray(arr)) return;
      arr.push(arr.length ? blank(arr[arr.length - 1]) : "");
      markDirty(); paint();
      return;
    }
    var btn = e.target.closest ? e.target.closest(".tools button") : null;
    if (!btn) return;
    e.preventDefault();
    var box = btn.parentNode;
    var arr = get(box.getAttribute("data-arr"));
    var i = Number(box.getAttribute("data-i"));
    var act = btn.getAttribute("data-act");
    if (!Array.isArray(arr)) return;
    if (act === "del") {
      if (arr.length <= 1 || window.confirm("Delete this item?")) arr.splice(i, 1);
    } else if (act === "up" && i > 0) {
      arr.splice(i - 1, 0, arr.splice(i, 1)[0]);
    } else if (act === "down" && i < arr.length - 1) {
      arr.splice(i + 1, 0, arr.splice(i, 1)[0]);
    } else if (act === "star") {
      var it = arr[i];
      if ("key" in it) it.key = !it.key;
      else if ("taken" in it) it.taken = !it.taken;
    }
    markDirty(); paint();
  });

  /* ---------------- publish ---------------- */
  function fullDoc() {
    var css = document.getElementById("css").textContent;
    var app = document.getElementById("app").textContent;
    var close = "<" + "/script>";
    return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      "<title>" + esc(STATE.meta.title) + "</title>\n" +
      '<style id="css">' + css + "</style>\n</head>\n<body>\n" +
      '<div id="root">' + render() + "</div>\n" +
      '<div id="bar" role="toolbar" aria-label="Page editing">' +
        '<span class="pill" id="bar-status">Editable</span>' +
        '<button class="b-edit" id="b-toggle" type="button">Edit page</button>' +
        '<button class="b-save" id="b-save" type="button" hidden>Save &amp; publish</button>' +
        '<button class="b-plain" id="b-cancel" type="button" hidden>Discard</button>' +
      "</div>\n" +
      '<div id="toast" role="status" aria-live="polite"></div>\n' +
      '<script type="application/json" id="state">\n' +
      JSON.stringify(STATE, null, 1).replace(/[\u007f-\uffff<]/g, function (c) {
        return "\\u" + ("000" + c.charCodeAt(0).toString(16)).slice(-4);
      }) + "\n" + close + "\n" +
      '<script id="app">' + app + close + "\n</body>\n</html>";
  }

  async function save() {
    var sv = document.getElementById("b-save");
    sv.disabled = true;
    status("Publishing\u2026");
    try {
      var res = await artifactNS.publish(fullDoc());
      DIRTY = false;
      toast("Published. Everyone with the link sees this version.");
      status("Saved");
    } catch (err) {
      var code = err && err.code ? err.code : "upstream_error";
      if (code === "conflict") {
        toast("Someone else published first \u2014 reloading to their version.");
      } else if (code === "not_writer" || code === "not_granted" || code === "not_declared" || code === "capability_disabled") {
        CAN_WRITE = false;
        document.body.classList.remove("can-edit");
        toast("This view is read-only, so changes can't be saved.");
      } else if (code === "too_large") {
        toast("The page is too large to publish. Remove some content and try again.");
      } else if (code === "rate_limited") {
        toast("Publishing too often. Wait a moment, then save again.");
      } else {
        toast("Couldn't publish. Your edits are still here \u2014 try saving again.");
      }
      status(DIRTY ? "Unsaved changes" : "Editable");
    } finally {
      sv.disabled = false;
    }
  }

  /* ---------------- hero trace ---------------- */
  function initTrace() {
    var canvas = document.getElementById("trace");
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var w = 0, h = 0, dpr = Math.min(window.devicePixelRatio || 1, 2), t = 0, raf;

    function color() {
      return getComputedStyle(document.documentElement).getPropertyValue("--trace").trim() || "12, 90, 82";
    }
    function resize() {
      var r = canvas.getBoundingClientRect();
      w = r.width; h = r.height;
      canvas.width = Math.max(1, Math.floor(w * dpr));
      canvas.height = Math.max(1, Math.floor(h * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function amp(x, phase) {
      var p = (x * 0.006 + phase) % (Math.PI * 2);
      var spike = Math.exp(-Math.pow((p - 2.2) * 3.4, 2)) - Math.exp(-Math.pow((p - 2.62) * 5.0, 2)) * 0.45;
      var drift = Math.sin(x * 0.0016 + phase * 0.7) * 0.30 + Math.sin(x * 0.0041 - phase * 0.4) * 0.16;
      return spike * 0.8 + drift;
    }
    function line(phase, yBase, scale, alpha) {
      ctx.beginPath();
      for (var x = 0; x <= w; x += 3) {
        var y = yBase - amp(x, phase) * scale;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = "rgba(" + color() + "," + alpha + ")";
      ctx.lineWidth = 1.25;
      ctx.stroke();
    }
    function draw() {
      ctx.clearRect(0, 0, w, h);
      line(t, h * 0.72, h * 0.20, 0.13);
      line(t * 0.62 + 2.0, h * 0.50, h * 0.15, 0.075);
      line(t * 0.41 + 4.3, h * 0.30, h * 0.11, 0.05);
    }
    function frame() { t += 0.0055; draw(); raf = requestAnimationFrame(frame); }

    if (initTrace._raf) cancelAnimationFrame(initTrace._raf);
    if (initTrace._onResize) window.removeEventListener("resize", initTrace._onResize);
    initTrace._onResize = function () { resize(); draw(); };
    resize(); draw();
    window.addEventListener("resize", initTrace._onResize);
    if (!reduce) { raf = requestAnimationFrame(frame); initTrace._raf = raf; }
  }

  /* ---------------- boot ---------------- */
  paint();

  document.getElementById("b-toggle").addEventListener("click", function () {
    EDITING = !EDITING;
    applyEditable(EDITING);
    if (EDITING) window.scrollTo({ top: 0, behavior: "smooth" });
  });
  document.getElementById("b-save").addEventListener("click", save);
  document.getElementById("b-cancel").addEventListener("click", function () {
    if (!DIRTY || window.confirm("Discard unsaved changes and reload the published version?")) location.reload();
  });

  window.addEventListener("beforeunload", function (e) {
    if (DIRTY) { e.preventDefault(); e.returnValue = ""; }
  });

  (async function () {
    if (!window.claude || typeof window.claude.use !== "function") return;
    artifactNS = await window.claude.use("artifact");
    if (!artifactNS || typeof artifactNS.publish !== "function") return;
    CAN_WRITE = true;
    document.body.classList.add("can-edit");
  })();
})();
</script>
